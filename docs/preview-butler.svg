<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="1200" height="760" rx="14" fill="#16171c" stroke="#33343f"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="600" y="29" fill="#6f6e85" font-size="12" text-anchor="middle">SecBrain — 管家</text>

  <!-- 侧栏 -->
  <rect x="1" y="48" width="196" height="711" fill="#191a20"/>
  <line x1="197" y1="48" x2="197" y2="759" stroke="#2b2c36"/>
  <text x="24" y="86" fill="#8b7cff" font-size="16" font-weight="700">SecBrain</text>
  <g font-size="13" fill="#8e8ca6">
    <text x="28" y="124">笔记</text><text x="28" y="158">日历</text><text x="28" y="190">提醒</text>
    <text x="28" y="222">图谱</text>
  </g>
  <rect x="12" y="236" width="172" height="30" rx="7" fill="#26263a"/>
  <text x="28" y="256" fill="#c3bdff" font-size="13">管家</text>
  <text x="28" y="290" fill="#8e8ca6" font-size="13">设置</text>

  <!-- 对话区 -->
  <text x="240" y="86" fill="#eceaf5" font-size="17" font-weight="600">AI 管家</text>
  <text x="240" y="108" fill="#6f6e85" font-size="12">已接入 DeepSeek · 检索命中 6 条知识库内容</text>

  <!-- 用户消息 -->
  <rect x="820" y="132" width="330" height="46" rx="12" fill="#2b2748"/>
  <text x="836" y="160" fill="#d9d4ff" font-size="13">我这周还有哪些待办没做完？</text>

  <!-- 助手消息 -->
  <rect x="240" y="196" width="600" height="150" rx="12" fill="#20212a" stroke="#2f3040"/>
  <text x="262" y="226" fill="#c8c6d8" font-size="13">这周还剩 3 项没完成：</text>
  <g fill="#b9b7d0" font-size="13">
    <text x="262" y="252">1. 中期材料定稿 —— 截止 10/29（周四）</text>
    <text x="262" y="276">2. 竞品拆解补充 2 家 —— 无截止</text>
    <text x="262" y="300">3. 简历投递 3 家 —— 截止 10/31（周六）</text>
  </g>
  <text x="262" y="328" fill="#6f6d85" font-size="12">已完成 4 项，其中「检索评测基线」10/25 完成</text>

  <!-- 引用卡片 -->
  <rect x="240" y="360" width="600" height="92" rx="10" fill="#1c1d25" stroke="#2f3040"/>
  <text x="262" y="386" fill="#8b7cff" font-size="11" font-weight="600">参考</text>
  <text x="262" y="410" fill="#b9b7d0" font-size="12.5">📄 项目周报 2026-W43 · 下周计划</text>
  <text x="262" y="432" fill="#7f7d99" font-size="11.5">「接入 reranker」「补 20 条拒答题」</text>

  <!-- 工具调用 -->
  <rect x="240" y="470" width="600" height="54" rx="10" fill="#1a2130" stroke="#2f4a6b"/>
  <text x="262" y="494" fill="#9dc4ea" font-size="11.5" font-weight="600">工具调用</text>
  <text x="262" y="512" fill="#7b93ad" font-size="11.5" font-family="ui-monospace, Menlo, monospace">list_tasks(filter=week) → 7 条 · search_notes(q=待办) → 3 条</text>

  <!-- 输入框 -->
  <rect x="240" y="672" width="910" height="52" rx="12" fill="#20212a" stroke="#33344a"/>
  <text x="262" y="703" fill="#5f5d78" font-size="13">问点什么，或说「提醒我周五交材料」…</text>
  <rect x="1096" y="684" width="34" height="28" rx="8" fill="#8b7cff"/>
  <path d="M1106 698 h14 m-6 -6 l6 6 l-6 6" stroke="#1b1c22" stroke-width="2" fill="none"/>

  <!-- 本地模式提示 -->
  <rect x="240" y="600" width="600" height="48" rx="10" fill="#221f33" stroke="#4a44a3"/>
  <text x="262" y="620" fill="#c3bdff" font-size="12" font-weight="600">本地规则模式</text>
  <text x="262" y="638" fill="#9a93c9" font-size="11.5">未配置 API 时自动兜底：日程 / 待办 / 记笔记 / 知识库检索，完全离线</text>
</svg>
