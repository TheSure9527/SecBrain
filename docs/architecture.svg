<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c22"/>
      <stop offset="1" stop-color="#15161b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a86"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="url(#bg)"/>

  <text x="40" y="52" fill="#eceaf5" font-size="22" font-weight="600">SecBrain 分层架构</text>
  <text x="40" y="76" fill="#8a88a3" font-size="13">依赖只能自上而下 · 领域层零 IO · 智能体层只调应用层用例</text>

  <!-- 渠道适配层 -->
  <rect x="40" y="104" width="1020" height="72" rx="10" fill="#20212a" stroke="#3a3b4a"/>
  <text x="60" y="132" fill="#b9b7d0" font-size="14" font-weight="600">⓪ 渠道适配层</text>
  <text x="60" y="156" fill="#7f7d99" font-size="12">钉钉 Stream · 验签 · 幂等去重 · 秒级 ACK · 按会话队列</text>
  <text x="900" y="146" fill="#5d5b78" font-size="11">channel/</text>

  <!-- 表现层 -->
  <rect x="40" y="196" width="1020" height="72" rx="10" fill="#20212a" stroke="#3a3b4a"/>
  <text x="60" y="224" fill="#b9b7d0" font-size="14" font-weight="600">① 表现层</text>
  <text x="60" y="248" fill="#7f7d99" font-size="12">React 视图 · 所见即所得编辑器 · 只经 preload 契约访问主进程</text>
  <text x="900" y="238" fill="#5d5b78" font-size="11">renderer/</text>

  <!-- 应用层 -->
  <rect x="40" y="288" width="1020" height="72" rx="10" fill="#20212a" stroke="#3a3b4a"/>
  <text x="60" y="316" fill="#b9b7d0" font-size="14" font-weight="600">② 应用层</text>
  <text x="60" y="340" fill="#7f7d99" font-size="12">笔记 · 日历 · 任务 · 日记 · 查询 · 材料索引 · 语义索引（用例编排与事务边界）</text>
  <text x="900" y="330" fill="#5d5b78" font-size="11">*-service.ts</text>

  <!-- 智能体层 -->
  <rect x="40" y="380" width="1020" height="72" rx="10" fill="#242338" stroke="#4a44a3"/>
  <text x="60" y="408" fill="#c8c2ff" font-size="14" font-weight="600">③ 智能体层</text>
  <text x="60" y="432" fill="#9a93c9" font-size="12">工具 Schema · 执行器 · 混合检索（FTS + 路径 + 向量 + RRF）· 本地规则兜底</text>
  <text x="900" y="422" fill="#6f68a8" font-size="11">ai/</text>

  <!-- 领域层 -->
  <rect x="40" y="472" width="500" height="72" rx="10" fill="#20212a" stroke="#3a3b4a"/>
  <text x="60" y="500" fill="#b9b7d0" font-size="14" font-weight="600">④ 领域层</text>
  <text x="60" y="524" fill="#7f7d99" font-size="12">时间规则 · ID · 冲突检测 · 分块 · 查询解析（纯函数）</text>

  <!-- 基础设施层 -->
  <rect x="560" y="472" width="500" height="72" rx="10" fill="#20212a" stroke="#3a3b4a"/>
  <text x="580" y="500" fill="#b9b7d0" font-size="14" font-weight="600">⑤ 基础设施层</text>
  <text x="580" y="524" fill="#7f7d99" font-size="12">Vault · SQLite FTS5 · CalDAV · ONNX 推理 · 文档解析</text>

  <!-- 横切面 -->
  <rect x="40" y="570" width="1020" height="56" rx="10" fill="#1a2130" stroke="#2f4a6b"/>
  <text x="60" y="596" fill="#9dc4ea" font-size="13" font-weight="600">横切面</text>
  <text x="60" y="616" fill="#7b93ad" font-size="12">契约定义（shared/）· 索引一致性（IndexCoordinator 统一扇出）· 可观测性（retrieval_log / 失败清单）</text>

  <!-- 依赖箭头 -->
  <line x1="550" y1="176" x2="550" y2="194" stroke="#6b6a86" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="550" y1="268" x2="550" y2="286" stroke="#6b6a86" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="550" y1="360" x2="550" y2="378" stroke="#6b6a86" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="550" y1="452" x2="550" y2="470" stroke="#6b6a86" stroke-width="1.4" marker-end="url(arrow)"/>

  <text x="40" y="672" fill="#5d5b78" font-size="12">校验：npm run check:layers —— 68 个文件，零层级违规、零循环依赖、零跨域深层导入</text>
  <text x="40" y="694" fill="#5d5b78" font-size="12">测试：414 个单元测试 · TypeScript 严格模式 · npm run verify 一道闸口全绿</text>
</svg>
